[package]
name = "herdr-ferry"
version = "0.1.0"
edition = "2021"
description = "Move files and clipboard between the Herdr box and your laptop over SSH"
license = "MIT"
repository = "https://github.com/wavrin/herdr-ferry"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
flate2 = "1"
hex = "0.4"
ignore = "0.4"
mime_guess = "2"
notify = "6"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"

[profile.release]
strip = true
lto = "thin"
